# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Deploy VitePress site to Pages

on:
  push:
    branches: [master, daily]

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Stable docs (master) are served from the site root, daily docs from /daily/.
      # Both builds run on every push to either branch, so the deployed site always has both.
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: master
          path: stable
          fetch-depth: 0
      - name: Checkout daily
        uses: actions/checkout@v4
        with:
          ref: daily
          path: daily
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          package_json_file: stable/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            stable/pnpm-lock.yaml
            daily/pnpm-lock.yaml
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build stable
        working-directory: stable
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build
      - name: Build daily
        working-directory: daily
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build:daily
      - name: Combine builds
        run: cp -r daily/docs/.vitepress/dist stable/docs/.vitepress/dist/daily
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stable/docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
